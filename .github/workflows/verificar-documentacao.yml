name: Verificar documentação

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  documentacao:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verificar compilado e identificadores
        run: node scripts/gerar-atividades.mjs --check
      - name: Verificar navegação documental
        run: node scripts/verificar-documentacao.mjs
      - name: Testar ferramentas de manutenção
        run: node --test scripts/documentacao.test.mjs
